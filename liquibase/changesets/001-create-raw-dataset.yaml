databaseChangeLog:
  - changeSet:
      id: 001-create-raw-dataset
      author: andia
      changes:
        - createTable:
            tableName: raw_dataset
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: raw_line
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: loaded_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addCheckConstraint:
            constraintName: chk_raw_dataset_line_not_empty
            tableName: raw_dataset
            constraintBody: length(trim(raw_line)) > 0
      rollback:
        - dropTable:
            tableName: raw_dataset
