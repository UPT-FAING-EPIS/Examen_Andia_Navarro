name: Infra - PostgreSQL con Terraform

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Aplicar infraestructura al Azure'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_location: ${{ secrets.TF_VAR_LOCATION }}
      TF_VAR_resource_group_name: ${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}
      TF_VAR_postgresql_server_name: ${{ secrets.TF_VAR_POSTGRESQL_SERVER_NAME }}
      TF_VAR_postgresql_admin_username: ${{ secrets.TF_VAR_POSTGRESQL_ADMIN_USERNAME }}
      TF_VAR_postgresql_admin_password: ${{ secrets.TF_VAR_POSTGRESQL_ADMIN_PASSWORD }}
      TF_VAR_postgresql_database_name: ${{ secrets.TF_VAR_POSTGRESQL_DATABASE_NAME }}
      TF_VAR_postgresql_sku_name: ${{ secrets.TF_VAR_POSTGRESQL_SKU_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Terraform apply
        if: github.event.inputs.apply == 'true'
        run: terraform -chdir=terraform apply -auto-approve tfplan
